    <!--
      Typography is self-hosted (see @font-face in styles.css). Preloading the
      two Latin files starts them in parallel with the stylesheet instead of
      waiting for the CSS to be parsed first, which is what causes the flash of
      fallback text. `crossorigin` is required on font preloads even same-origin.
    -->
    <link
      rel="preload"
      href="fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/jetbrains-mono-latin.woff2"

    />
