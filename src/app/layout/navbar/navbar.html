<!-- Skip link: first tab stop, invisible until focused -->
<a
  class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[60] focus:rounded-lg focus:bg-primary focus:px-4 focus:py-2 focus:text-body focus:font-medium focus:text-primary-foreground"
  href="#about"
>
  Skip to content
</a>

<header
  class="no-print fixed inset-x-0 top-0 z-50 transition-all duration-300"
  [class]="shellClass()"
>
  <!-- Reading progress -->
  <div
    class="absolute inset-x-0 top-0 h-px origin-left bg-gradient-to-r from-primary/70 to-accent-warm transition-[transform] duration-150 ease-out"
    [style.transform]="'scaleX(' + progress() / 100 + ')'"
    aria-hidden="true"
  ></div>

  <nav
    class="mx-auto flex h-16 max-w-6xl items-center justify-between px-5 sm:px-6"
    aria-label="Primary"
  >
    <!-- Negative margin keeps the wordmark optically on the container edge
         while the button itself grows to a 44px touch target. -->
    <button
      type="button"
      class="-ml-2.5 inline-flex h-11 items-center rounded-lg px-2.5 font-mono text-body font-semibold tracking-wider text-primary transition-opacity hover:opacity-80"
      (click)="navigate('top')"
    >
      MS<span class="animate-cursor-blink">_</span>
    </button>

    <!-- Desktop -->
    <ul class="hidden items-center gap-3 md:flex">
      @for (item of navItems(); track item.id) {
        <li>
          <button
            type="button"
            class="link-underline inline-flex min-h-11 min-w-11 items-center justify-center px-2 text-body transition-colors duration-200"
            [class.text-foreground]="activeSection() === item.id"
            [class.text-muted-foreground]="activeSection() !== item.id"
            [attr.data-active]="activeSection() === item.id"
            [attr.aria-current]="activeSection() === item.id ? 'true' : null"
            (click)="navigate(item.id)"
          >
            {{ item.label }}
          </button>
        </li>
      }
    </ul>

    <div class="flex items-center gap-2">
      <a
        class="hidden min-h-11 items-center gap-2 rounded-lg border border-primary/30 bg-primary/10 px-4 text-caption font-medium text-primary transition-all duration-200 hover:bg-primary/20 active:scale-[0.97] sm:inline-flex"
        [href]="profile().cvUrl"
        [attr.download]="'Merab_Samkharadze_CV.pdf'"
      >
        <app-icon name="download" [size]="15" />
        Download CV
      </a>

      <button
        type="button"
        class="inline-flex h-11 w-11 items-center justify-center rounded-lg text-foreground transition-transform active:scale-95 md:hidden"
        [attr.aria-expanded]="mobileOpen()"
        aria-controls="mobile-menu"
        [attr.aria-label]="mobileOpen() ? 'Close menu' : 'Open menu'"
        (click)="toggleMobile()"
      >
        <app-icon [name]="mobileOpen() ? 'close' : 'menu'" [size]="20" />
      </button>
    </div>
  </nav>

  <!-- Mobile -->
  <div
    id="mobile-menu"
    class="overflow-hidden border-border bg-card/95 backdrop-blur-xl transition-[max-height,opacity] duration-300 ease-out md:hidden"
    [class]="mobileOpen() ? 'max-h-[32rem] opacity-100 border-b' : 'max-h-0 opacity-0'"
    [attr.inert]="mobileOpen() ? null : ''"
  >
    <ul class="space-y-1 px-5 pb-5 pt-2">
      @for (item of navItems(); track item.id) {
        <li>
          <button
            type="button"
            class="block w-full rounded-lg px-4 py-3 text-left text-body transition-colors duration-200"
            [class]="
              activeSection() === item.id
                ? 'bg-primary/10 text-primary font-medium'
                : 'text-muted-foreground'
            "
            (click)="navigate(item.id)"
          >
            {{ item.label }}
          </button>
        </li>
      }
      <li class="pt-2">
        <a
          class="flex items-center justify-center gap-2 rounded-lg bg-primary px-4 py-3 text-body font-medium text-primary-foreground"
          [href]="profile().cvUrl"
          [attr.download]="'Merab_Samkharadze_CV.pdf'"
        >
          <app-icon name="download" [size]="16" />
          Download CV
        </a>
      </li>
    </ul>
  </div>
</header>
