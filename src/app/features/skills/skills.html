<section
  id="skills"
  class="scroll-mt-24 border-y border-border/60 bg-card/25 px-5 py-24 sm:px-6 sm:py-28 lg:py-32"
>
  <div class="mx-auto max-w-6xl">
    <app-section-heading
      eyebrow="Skills"
      heading="What I work with"
      lead="Grouped by where it sits in the stack and labelled with how deep I actually am — no bar charts implying a precision nobody has."
    />

    <!-- Legend: the same chip vocabulary the cards below use -->
    <ul appReveal class="mt-8 flex flex-wrap gap-2">
      @for (level of levels; track level) {
        <li>
          <app-chip [tone]="toneFor(level)" compact>{{ labelFor(level) }}</app-chip>
        </li>
      }
    </ul>

    <ul class="stagger mt-10 grid gap-5 md:grid-cols-2">
      @for (group of primaryGroups(); track group.id) {
        <li appReveal class="h-full">
          <app-skill-group-card [group]="group" variant="primary" />
        </li>
      }
    </ul>

    <ul class="stagger mt-5 grid gap-5 sm:grid-cols-2 lg:grid-cols-4">
      @for (group of secondaryGroups(); track group.id) {
        <li appReveal class="h-full">
          <app-skill-group-card [group]="group" variant="secondary" />
        </li>
      }
    </ul>
  </div>
</section>
