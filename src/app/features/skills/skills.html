<section
  id="skills"
  class="scroll-mt-24 border-y border-border/60 bg-card/25 px-5 py-16 sm:px-6 lg:py-24"
>
  <div class="mx-auto max-w-6xl">
    <app-section-heading
      eyebrow="Skills"
      heading="What I work with"
      lead="Grouped by where it sits in the stack and labelled with how deep I actually am — no bar charts implying a precision nobody has."
    />

    <!--
      One card type, one grid. The depth label that used to live in a `title`
      tooltip is now a heading inside each card, so it reads on a phone.
    -->
    <ul class="stagger mt-12 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
      @for (group of skillGroups(); track group.id) {
        <li appReveal class="h-full">
          <app-skill-group-card [group]="group" />
        </li>
      }
    </ul>
  </div>
</section>
