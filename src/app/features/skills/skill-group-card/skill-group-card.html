<article
  class="card-hover group flex flex-col rounded-2xl border border-border"
  [class]="isPrimary() ? 'bg-card p-6 sm:p-7' : 'surface-quiet p-5 sm:p-6'"
>
  @if (isPrimary()) {
    <header class="mb-4 flex items-start gap-3.5">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-border bg-secondary text-foreground/70"
      >
        <app-icon [name]="group().icon" [size]="18" />
      </span>

      <div class="min-w-0">
        <h3 class="text-base font-semibold transition-colors duration-200 group-hover:text-primary">
          {{ group().title }}
        </h3>
        <p class="mt-1 text-pretty text-caption leading-relaxed text-muted-foreground">
          {{ group().caption }}
        </p>
      </div>
    </header>
  } @else {
    <header class="mb-4">
      <h3
        class="flex items-center gap-2.5 text-sm font-semibold transition-colors duration-200 group-hover:text-primary"
      >
        <app-icon [name]="group().icon" [size]="16" class="text-foreground/60" />
        {{ group().title }}
      </h3>
      <p class="mt-1.5 text-pretty text-xs leading-relaxed text-muted-foreground">
        {{ group().caption }}
      </p>
    </header>
  }

  <ul class="flex flex-wrap" [class]="isPrimary() ? 'gap-2' : 'gap-1.5'">
    @for (skill of group().skills; track skill.name) {
      <li>
        <app-chip
          [tone]="toneFor(skill.level)"
          [compact]="!isPrimary()"
          [attr.title]="labelFor(skill.level)"
        >
          {{ skill.name }}
        </app-chip>
      </li>
    }
  </ul>
</article>
