<app-card-shell surface="raised">
  <p data-slot="meta" class="font-mono text-mono-label uppercase text-muted-foreground">
    {{ project().context }} · {{ project().period }}
  </p>

  <h3
    data-slot="title"
    class="text-pretty text-h3 font-semibold transition-colors group-hover:text-primary"
  >
    {{ project().title }}
  </h3>

  <p data-slot="claim" class="max-w-[68ch] text-pretty text-body-lg text-foreground">
    {{ project().summary }}
  </p>

  @if (project().metrics.length) {
    <app-metric-row data-slot="metrics" [stats]="project().metrics" />
  }

  @if (project().highlights.length) {
    <app-disclosure-list data-slot="detail" class="max-w-[68ch]" [items]="project().highlights" />
  }

  <div data-slot="stack" class="flex flex-col gap-4">
    <app-tech-list [items]="project().stack" />

    @if (project().links.length) {
      <ul class="flex flex-wrap gap-3">
        @for (link of project().links; track link.href) {
          <li>
            <a
              class="inline-flex min-h-11 items-center gap-2 rounded-lg border border-border bg-secondary px-4 text-body font-medium text-foreground transition-colors hover:border-primary/30 hover:text-primary"
              [href]="link.href"
              target="_blank"
              rel="noopener noreferrer"
            >
              <app-icon [name]="link.icon" [size]="14" />
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    }
  </div>
</app-card-shell>
