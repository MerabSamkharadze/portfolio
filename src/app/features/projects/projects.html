<section id="projects" class="scroll-mt-24 px-5 py-16 sm:px-6 lg:py-24">
  <div class="mx-auto max-w-6xl">
    <app-section-heading
      eyebrow="Projects"
      heading="Selected work"
      lead="Four products in production, one of them built entirely on my own. How each problem was actually solved — numbers where I have them."
    />

    <!--
      One plain two-column grid. Capping the visible bullets at three is what
      made this possible: the cards that used to differ by 338px now match to
      the pixel, so nothing has to be given a full row to hide a ragged edge.
    -->
    <ul class="stagger mt-12 grid gap-5 lg:grid-cols-2">
      @for (project of featured(); track project.id) {
        <li appReveal class="h-full">
          <app-project-card [project]="project" />
        </li>
      }
    </ul>

    @if (additional().length) {
      <ul class="stagger mt-5 grid gap-5">
        @for (project of additional(); track project.id) {
          <li appReveal>
            <app-project-brief [project]="project" />
          </li>
        }
      </ul>
    }
  </div>
</section>
