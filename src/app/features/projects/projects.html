<section id="projects" class="scroll-mt-24 px-5 py-24 sm:px-6 sm:py-28 lg:py-32">
  <div class="mx-auto max-w-6xl">
    <app-section-heading
      eyebrow="Projects"
      heading="Selected work"
      lead="Four products in production, one of them built entirely on my own. How each problem was actually solved — numbers where I have them."
    />

    <ul class="stagger mt-14 grid gap-6 lg:grid-cols-2">
      @for (project of featured(); track project.id) {
        <li appReveal class="h-full">
          <app-project-card [project]="project" />
        </li>
      }
    </ul>

    @if (additional().length) {
      <ul class="stagger mt-6 grid gap-5">
        @for (project of additional(); track project.id) {
          <li appReveal>
            <app-project-brief [project]="project" />
          </li>
        }
      </ul>
    }
  </div>
</section>
