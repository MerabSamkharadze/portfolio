<app-card-shell surface="quiet">
  <p data-slot="meta" class="font-mono text-mono-label uppercase text-muted-foreground">
    {{ project().context }} · {{ project().period }}
  </p>

  <h3 data-slot="title" class="text-pretty text-h3 font-semibold">{{ project().title }}</h3>

  <p data-slot="claim" class="max-w-[68ch] text-pretty text-body-lg text-foreground">
    {{ project().summary }}
  </p>

  <div data-slot="stack">
    <app-tech-list [items]="project().stack" />
  </div>
</app-card-shell>
