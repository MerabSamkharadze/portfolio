<section id="education" class="scroll-mt-24 px-5 py-24 sm:px-6 sm:py-28 lg:py-32">
  <div class="mx-auto max-w-5xl">
    <app-section-heading
      eyebrow="Education & Training"
      heading="Degrees first, then the part that made me a developer"
      lead="Two economics degrees from Tbilisi State University, then two specialist IT programmes. The second of those I took while already working full time as a developer."
    />

    <div class="stagger mt-14 grid gap-5 sm:grid-cols-2">
      @for (item of items(); track item.id) {
        <article
          appReveal
          class="card-hover group flex h-full flex-col rounded-2xl border border-border bg-card p-6"
        >
          <header class="mb-3 flex items-start gap-3.5">
            <span
              class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-border bg-secondary text-primary"
            >
              <app-icon [name]="iconFor(item.kind)" [size]="15" />
            </span>
            <div class="min-w-0">
              <h3
                class="text-pretty text-sm font-semibold leading-snug transition-colors duration-200 group-hover:text-primary"
              >
                {{ item.title }}
              </h3>
              <p class="mt-1 text-xs text-muted-foreground">{{ item.institution }}</p>
            </div>
          </header>

          <span class="font-mono text-[11px] text-primary/70">{{ item.period }}</span>

          @if (item.detail; as detail) {
            <p class="mt-3 text-pretty text-[13px] leading-relaxed text-muted-foreground">{{ detail }}</p>
          }
        </article>
      }
    </div>
  </div>
</section>
