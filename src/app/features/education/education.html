<section id="education" class="scroll-mt-24 px-5 py-16 sm:px-6 lg:py-24">
  <div class="mx-auto max-w-5xl">
    <app-section-heading
      eyebrow="Education & Training"
      heading="Degrees first, then the part that made me a developer"
      lead="Two economics degrees from Tbilisi State University, then two specialist IT programmes. The second of those I took while already working full time as a developer."
    />

    <ul class="stagger mt-12 grid items-start gap-5 sm:grid-cols-2">
      @for (item of items(); track item.id) {
        <li appReveal>
          <app-education-card [item]="item" />
        </li>
      }
    </ul>
  </div>
</section>
