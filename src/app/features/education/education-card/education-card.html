<article class="card-hover group flex h-full flex-col rounded-2xl border border-border bg-card p-6">
  <header class="mb-3 flex items-start gap-3.5">
    <span
      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-border bg-secondary text-primary"
    >
      <app-icon [name]="icon()" [size]="15" />
    </span>

    <div class="min-w-0">
      <h3
        class="text-pretty text-sm font-semibold leading-snug transition-colors duration-200 group-hover:text-primary"
      >
        {{ item().title }}
      </h3>
      <p class="mt-1 text-xs text-muted-foreground">{{ item().institution }}</p>
    </div>
  </header>

  <span class="font-mono text-[11px] text-primary/70">{{ item().period }}</span>

  @if (item().detail; as detail) {
    <p class="mt-3 text-pretty text-[13px] leading-relaxed text-muted-foreground">{{ detail }}</p>
  }
</article>
