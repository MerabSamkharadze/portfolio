<app-card-shell surface="quiet">
  <p
    data-slot="meta"
    class="flex items-center gap-2 font-mono text-mono-label uppercase text-muted-foreground"
  >
    <app-icon [name]="icon()" [size]="14" />
    {{ item().period }}
  </p>

  <h3 data-slot="title" class="text-pretty text-h3 font-semibold">{{ item().title }}</h3>

  @if (item().detail; as detail) {
    <p data-slot="claim" class="max-w-[68ch] text-pretty text-body-lg text-foreground">
      {{ detail }}
    </p>
  }

  <p data-slot="stack" class="font-mono text-mono-label text-muted-foreground">
    {{ item().institution }}
  </p>
</app-card-shell>
