<div class="relative flex gap-6">
  <!-- Timeline node -->
  <span
    class="relative z-10 hidden h-10 w-10 shrink-0 items-center justify-center rounded-full border border-border bg-secondary sm:flex"
    aria-hidden="true"
  >
    <app-icon name="briefcase" [size]="16" class="text-primary" />

    @if (entry().current) {
      <span class="absolute -right-0.5 -top-0.5 flex h-3 w-3">
        <span
          class="absolute inline-flex h-full w-full animate-ping rounded-full bg-primary/70"
        ></span>
        <span
          class="relative inline-flex h-3 w-3 rounded-full border-2 border-background bg-primary"
        ></span>
      </span>
    }
  </span>

  <article class="card-hover group flex-1 rounded-2xl border border-border bg-card p-6 sm:p-8">
    <header class="mb-4 flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
      <div>
        <h3 class="text-lg font-semibold transition-colors duration-200 group-hover:text-primary">
          {{ entry().role }}
        </h3>
        <p class="mt-0.5 text-sm text-muted-foreground">
          <span class="text-foreground/80">{{ entry().company }}</span>
          · {{ entry().location }}
        </p>
      </div>

      <span
        class="inline-flex shrink-0 items-center gap-2 self-start whitespace-nowrap rounded-md bg-primary/10 px-3 py-1 font-mono text-[11px] text-primary"
      >
        @if (entry().current) {
          <span class="h-1.5 w-1.5 rounded-full bg-primary"></span>
        }
        {{ entry().period }}
      </span>
    </header>

    <p class="mb-5 text-pretty text-sm leading-relaxed text-foreground/75">{{ entry().summary }}</p>

    <ul class="space-y-3">
      @for (achievement of entry().achievements; track $index) {
        <li class="flex gap-3 text-[13px] leading-relaxed text-muted-foreground">
          <span class="mt-1.5 shrink-0 text-primary" aria-hidden="true">▸</span>
          <span class="text-pretty">{{ achievement }}</span>
        </li>
      }
    </ul>

    <app-tech-list class="mt-6" [items]="entry().stack" divided />
  </article>
</div>
