<div class="relative flex gap-5">
  <!-- Marker: the current roles are filled, everything past is a hollow ring -->
  <span
    class="relative z-10 mt-5 hidden h-3 w-3 shrink-0 rounded-full border-2 sm:block"
    [class]="entry().current ? 'border-primary bg-primary' : 'border-border bg-background'"
    aria-hidden="true"
  >
    @if (entry().current) {
      <span class="absolute -inset-1 animate-ping-once rounded-full bg-primary/40"></span>
    }
  </span>

  <app-card-shell class="flex-1" [surface]="entry().current ? 'raised' : 'base'">
    <p data-slot="meta" class="font-mono text-mono-label uppercase text-muted-foreground">
      {{ entry().company }} · {{ entry().location }} · {{ entry().period }}
    </p>

    <h3 data-slot="title" class="text-h3 font-semibold transition-colors group-hover:text-primary">
      {{ entry().role }}
    </h3>

    <p data-slot="claim" class="max-w-[68ch] text-pretty text-body-lg text-foreground">
      {{ entry().summary }}
    </p>

    <app-disclosure-list data-slot="detail" class="max-w-[68ch]" [items]="entry().achievements" />

    <div data-slot="stack">
      <app-tech-list [items]="entry().stack" />
    </div>
  </app-card-shell>
</div>
