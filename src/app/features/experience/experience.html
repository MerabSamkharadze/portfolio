<section
  id="experience"
  class="scroll-mt-24 border-y border-border/60 bg-card/25 px-5 py-16 sm:px-6 sm:py-20 lg:py-24"
>
  <div class="mx-auto max-w-5xl">
    <app-section-heading
      eyebrow="Experience"
      heading="Two years, four products"
      lead="Written as outcomes rather than duties — what changed because the work was done."
    />

    <div class="relative mt-12">
      <!-- Timeline spine, hidden on mobile where the markers are not rendered -->
      <span
        class="absolute bottom-0 left-[5px] top-0 hidden w-px bg-gradient-to-b from-transparent via-border to-transparent sm:block"
        aria-hidden="true"
      ></span>

      <ol class="space-y-5">
        @for (role of roles(); track role.id) {
          <li appReveal>
            <app-timeline-entry [entry]="role" />
          </li>
        }
      </ol>
    </div>
  </div>
</section>
