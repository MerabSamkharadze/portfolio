<section
  id="top"
  class="relative flex min-h-[100dvh] flex-col justify-center overflow-hidden px-5 pb-16 pt-28 sm:px-6 sm:pt-24"
>
  <!-- Blueprint grid -->
  <div
    class="grid-backdrop pointer-events-none absolute inset-0 opacity-[0.035]"
    aria-hidden="true"
  ></div>

  <!-- Ambient glow -->
  <div
    class="pointer-events-none absolute -right-24 top-1/4 h-80 w-80 rounded-full bg-primary/5 blur-[120px] sm:h-96 sm:w-96"
    aria-hidden="true"
  ></div>
  <div
    class="pointer-events-none absolute -left-32 bottom-1/4 h-72 w-72 rounded-full bg-accent-warm/5 blur-[130px] animate-float"
    aria-hidden="true"
  ></div>

  <div
    class="relative mx-auto grid w-full max-w-6xl gap-12 lg:grid-cols-[1.15fr_0.85fr] lg:items-center lg:gap-16"
  >
    <!-- Text column -->
    <div class="text-center lg:text-left">
      <p
        class="mb-5 inline-flex animate-slide-up items-center justify-center gap-3 font-mono text-mono-label uppercase tracking-[0.08em] text-muted-foreground opacity-0 lg:justify-start"
        style="animation-delay: 0.12s"
      >
        <span class="hidden h-px w-6 bg-border lg:inline-block" aria-hidden="true"></span>
        {{ profile().headline }}
      </p>

      <h1
        class="mb-6 animate-slide-up text-display font-bold opacity-0"
        style="animation-delay: 0.2s"
      >
        <span class="text-foreground">{{ profile().firstName }}</span>
        <br />
        <span class="text-gradient">{{ profile().lastName }}</span>
      </h1>

      <p
        class="mx-auto mb-10 max-w-xl animate-slide-up text-pretty text-body-lg leading-relaxed text-muted-foreground opacity-0 lg:mx-0"
        style="animation-delay: 0.32s"
      >
        {{ profile().pitch }}
      </p>

      <!-- Calls to action -->
      <div
        class="flex animate-slide-up flex-col items-stretch justify-center gap-3 opacity-0 sm:flex-row sm:items-center lg:justify-start"
        style="animation-delay: 0.42s"
      >
        <button
          type="button"
          class="inline-flex items-center justify-center gap-2 rounded-lg bg-primary px-6 py-3.5 text-sm font-medium text-primary-foreground transition-all duration-200 hover:brightness-110 active:scale-[0.97]"
          (click)="goTo('projects')"
        >
          <app-icon name="layers" [size]="16" />
          View my work
        </button>

        <a
          class="inline-flex items-center justify-center gap-2 rounded-lg border border-border px-6 py-3.5 text-sm font-medium text-foreground transition-all duration-200 hover:border-primary/40 hover:bg-secondary active:scale-[0.97]"
          [href]="profile().cvUrl"
          [attr.download]="'Merab_Samkharadze_CV.pdf'"
        >
          <app-icon name="download" [size]="16" />
          Download CV
        </a>
      </div>
    </div>

    <!-- Photo + status column -->
    <div
      class="mx-auto flex w-full max-w-[280px] animate-slide-up flex-col items-center gap-6 opacity-0 lg:mx-0 lg:max-w-none"
      style="animation-delay: 0.26s"
    >
      <div class="group relative w-full max-w-[280px] lg:max-w-[300px]">
        <!-- Corner marks — a viewfinder frame, not a decoration: kept neutral -->
        <span
          class="absolute -left-2.5 -top-2.5 h-6 w-6 border-l-2 border-t-2 border-foreground/25"
          aria-hidden="true"
        ></span>
        <span
          class="absolute -right-2.5 -top-2.5 h-6 w-6 border-r-2 border-t-2 border-foreground/25"
          aria-hidden="true"
        ></span>
        <span
          class="absolute -bottom-2.5 -left-2.5 h-6 w-6 border-b-2 border-l-2 border-foreground/25"
          aria-hidden="true"
        ></span>
        <span
          class="absolute -bottom-2.5 -right-2.5 h-6 w-6 border-b-2 border-r-2 border-foreground/25"
          aria-hidden="true"
        ></span>

        <div class="relative aspect-[4/5] w-full overflow-hidden rounded-2xl border border-border">
          <img
            [src]="profile().photoUrl"
            [alt]="profile().name"
            width="320"
            height="400"
            fetchpriority="high"
            class="h-full w-full object-cover object-center transition-transform duration-300 group-hover:scale-105"
          />
        </div>
      </div>

      <!-- Availability -->
      <p
        class="inline-flex items-center gap-2 rounded-full border border-border bg-card/60 px-4 py-1.5 text-mono-label text-muted-foreground backdrop-blur-sm"
      >
        <span class="relative flex h-2 w-2 shrink-0">
          <span
            class="absolute inline-flex h-full w-full animate-ping rounded-full bg-primary/70"
          ></span>
          <span class="relative inline-flex h-2 w-2 rounded-full bg-primary"></span>
        </span>
        {{ profile().availability }}
      </p>

      <!-- Stats -->
      <app-stat-grid
        class="block w-full"
        [stats]="stats()"
        variant="hero"
        columnsClass="grid-cols-2"
      />
    </div>
  </div>

  <!-- Technology marquee -->
  <div
    class="mask-edges relative mx-auto mt-12 w-full max-w-5xl overflow-hidden"
    aria-hidden="true"
  >
    <div class="flex w-max animate-marquee gap-3">
      @for (tech of marqueeLoop(); track $index) {
        <span
          class="whitespace-nowrap rounded-md border border-border/60 bg-card/40 px-3 py-1.5 font-mono text-mono-label text-muted-foreground"
        >
          {{ tech }}
        </span>
      }
    </div>
  </div>

  <!-- Scroll cue -->
  <button
    type="button"
    class="no-print absolute bottom-4 left-1/2 inline-flex h-11 w-11 -translate-x-1/2 animate-bounce items-center justify-center rounded-lg text-muted-foreground transition-colors hover:text-primary"
    aria-label="Scroll to About"
    (click)="goTo('about')"
  >
    <app-icon name="arrowDown" [size]="20" />
  </button>
</section>
