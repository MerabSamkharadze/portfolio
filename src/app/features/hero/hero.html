<section
  id="top"
  class="relative flex min-h-[100dvh] flex-col items-center justify-center overflow-hidden px-5 pb-16 pt-28 sm:px-6 sm:pt-24"
>
  <!-- Blueprint grid -->
  <div class="grid-backdrop pointer-events-none absolute inset-0 opacity-[0.035]" aria-hidden="true"></div>

  <!-- Ambient glow -->
  <div
    class="pointer-events-none absolute -right-24 top-1/4 h-80 w-80 rounded-full bg-primary/5 blur-[120px] sm:h-96 sm:w-96"
    aria-hidden="true"
  ></div>
  <div
    class="pointer-events-none absolute -left-32 bottom-1/4 h-72 w-72 rounded-full bg-accent-warm/5 blur-[130px] animate-float"
    aria-hidden="true"
  ></div>

  <div class="relative mx-auto w-full max-w-4xl text-center">
    <!-- Photo -->
    <div
      class="group relative mx-auto mb-8 h-32 w-32 animate-slide-up opacity-0 sm:mb-10 sm:h-44 sm:w-44"
      style="animation-delay: 0.05s"
    >
      <div
        class="absolute -inset-1 animate-spin-slow rounded-full bg-gradient-to-br from-primary/45 via-primary/10 to-transparent opacity-60"
        aria-hidden="true"
      ></div>
      <div
        class="relative h-full w-full overflow-hidden rounded-full border-2 border-primary/20 shadow-2xl shadow-primary/10"
      >
        <img
          [src]="profile().photoUrl"
          [alt]="profile().name"
          width="352"
          height="352"
          fetchpriority="high"
          class="h-full w-full object-cover object-center transition-transform duration-500 group-hover:scale-105"
        />
      </div>
    </div>

    <!-- Availability -->
    <p
      class="mb-6 inline-flex animate-slide-up items-center gap-2 rounded-full border border-border bg-card/60 px-4 py-1.5 text-[11px] text-muted-foreground opacity-0 backdrop-blur-sm"
      style="animation-delay: 0.12s"
    >
      <span class="relative flex h-2 w-2">
        <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-primary/70"></span>
        <span class="relative inline-flex h-2 w-2 rounded-full bg-primary"></span>
      </span>
      {{ profile().availability }}
    </p>

    <p
      class="mb-5 animate-slide-up font-mono text-[11px] uppercase tracking-[0.32em] text-primary opacity-0 sm:text-xs"
      style="animation-delay: 0.18s"
    >
      {{ profile().headline }}
    </p>

    <h1
      class="mb-6 animate-slide-up text-[2.75rem] font-bold leading-[0.92] tracking-tight opacity-0 sm:text-7xl lg:text-8xl"
      style="animation-delay: 0.26s"
    >
      <span class="text-foreground">{{ profile().firstName }}</span>
      <br />
      <span class="text-gradient">{{ profile().lastName }}</span>
    </h1>

    <p
      class="mx-auto mb-10 max-w-xl animate-slide-up text-pretty text-[15px] leading-relaxed text-muted-foreground opacity-0 sm:text-lg"
      style="animation-delay: 0.36s"
    >
      {{ profile().pitch }}
    </p>

    <!-- Calls to action -->
    <div
      class="flex animate-slide-up flex-col items-stretch justify-center gap-3 opacity-0 sm:flex-row sm:items-center"
      style="animation-delay: 0.46s"
    >
      <button
        type="button"
        class="inline-flex items-center justify-center gap-2 rounded-lg bg-primary px-6 py-3.5 text-sm font-medium text-primary-foreground transition-all duration-200 hover:brightness-110 active:scale-[0.97]"
        (click)="goTo('projects')"
      >
        <app-icon name="layers" [size]="16" />
        View my work
      </button>

      <a
        class="inline-flex items-center justify-center gap-2 rounded-lg border border-border px-6 py-3.5 text-sm font-medium text-foreground transition-all duration-200 hover:border-primary/40 hover:bg-secondary active:scale-[0.97]"
        [href]="profile().cvUrl"
        [attr.download]="'Merab_Samkharadze_CV.pdf'"
      >
        <app-icon name="download" [size]="16" />
        Download CV
      </a>
    </div>

    <!-- Stats -->
    <dl
      class="mx-auto mt-12 grid max-w-2xl animate-slide-up grid-cols-2 gap-3 opacity-0 sm:mt-14 sm:grid-cols-4 sm:gap-4"
      style="animation-delay: 0.56s"
    >
      @for (stat of stats(); track stat.label) {
        <div
          class="card-hover rounded-xl border border-border bg-card/60 px-3 py-4 backdrop-blur-sm sm:px-4 sm:py-5"
        >
          <dt class="sr-only">{{ stat.label }}</dt>
          <dd>
            <span class="block font-mono text-2xl font-bold text-gradient sm:text-3xl">{{ stat.value }}</span>
            <span class="mt-1.5 block text-[11px] leading-tight text-muted-foreground">{{ stat.label }}</span>
          </dd>
        </div>
      }
    </dl>
  </div>

  <!-- Technology marquee -->
  <div class="mask-edges relative mt-14 w-full max-w-5xl overflow-hidden" aria-hidden="true">
    <div class="flex w-max animate-marquee gap-3">
      @for (tech of marqueeLoop(); track $index) {
        <span
          class="whitespace-nowrap rounded-md border border-border/60 bg-card/40 px-3 py-1.5 font-mono text-[11px] text-muted-foreground"
        >
          {{ tech }}
        </span>
      }
    </div>
  </div>

  <!-- Scroll cue -->
  <button
    type="button"
    class="no-print absolute bottom-6 left-1/2 -translate-x-1/2 animate-bounce text-muted-foreground transition-colors hover:text-primary"
    aria-label="Scroll to About"
    (click)="goTo('about')"
  >
    <app-icon name="arrowDown" [size]="20" />
  </button>
</section>
