<section id="about" class="scroll-mt-24 px-5 py-16 sm:px-6 lg:py-24">
  <div class="mx-auto max-w-6xl">
    <app-section-heading
      eyebrow="About"
      heading="Shipping to other people's deadlines, and to my own"
      lead="Where I am now, how I got here, and where I am pointed next."
    />

    <div class="mt-12 grid gap-12 lg:grid-cols-[1.55fr_1fr]">
      <!-- Narrative, held to a readable measure -->
      <div class="max-w-[68ch] space-y-6">
        @for (paragraph of paragraphs(); track $index) {
          <p [appReveal]="$index * 50" class="text-pretty text-body-lg text-muted-foreground">
            {{ paragraph }}
          </p>
        }

        <div appReveal class="glow-line h-px w-full"></div>

        <div appReveal class="flex flex-wrap items-center gap-x-6 gap-y-3 text-body">
          <span class="flex items-center gap-2 text-muted-foreground">
            <app-icon name="mapPin" [size]="14" />
            {{ profile().location }}
          </span>
          @for (language of languages(); track language.name) {
            <span class="flex items-center gap-2 text-muted-foreground">
              <app-icon name="globe" [size]="14" />
              {{ language.name }} · {{ language.level }}
            </span>
          }
        </div>
      </div>

      <!--
        The narrative runs far longer than this card, so on a wide screen the
        card rides down with it instead of finishing early and leaving the rest
        of its column empty.
      -->
      <aside appReveal>
        <app-card-shell class="lg:sticky lg:top-24" surface="base">
          <h3 data-slot="title" class="flex items-center gap-2 text-h3 font-semibold">
            <app-icon name="sparkles" [size]="16" />
            How I work
          </h3>

          <ul data-slot="detail" class="space-y-3">
            @for (highlight of highlights(); track highlight) {
              <li><app-lead-bullet [text]="highlight" /></li>
            }
          </ul>
        </app-card-shell>
      </aside>
    </div>
  </div>
</section>
